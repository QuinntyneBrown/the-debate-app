<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · error — The Debate App mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="sign-in">
<meta name="mock:state" content="error">
<meta name="mock:requirements" content="L2-013 L2-014 L2-019 L2-026">
<meta name="description" content="The token endpoint could not be reached; the form stays filled and offers a retry.">
<link rel="stylesheet" href="../../../design-system/tokens/tokens.css">
<link rel="stylesheet" href="../../../design-system/assets/components.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark" style="background: var(--color-accent-subtle); color: var(--color-fg-accent);"><svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h9a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H9l-4 3v-3a3 3 0 0 1-1-2.2V8a3 3 0 0 1 0-3z"/><path d="M16 9h2a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-1l-3 3v-3"/></svg></span></div>
    <div class="card stack">
      <h1 style="text-align: center;">Sign in</h1>
      <form class="stack" action="../../pages/meetings/default.html" method="get" novalidate>
        <div class="alert alert--danger" role="alert"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div class="alert__body"><div class="alert__title">We couldn't reach the server</div><div>Your details are still here.</div></div></div>
        <div class="field"><label class="field__label" for="username">Username</label><input class="input" id="username" name="username" type="text" autocomplete="username" required autocapitalize="none" spellcheck="false" value="admin"></div>
        <div class="field"><label class="field__label" for="password">Password</label><div class="input-group"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required value="••••••••••" autofocus><button class="btn btn--ghost btn--icon input-group__btn" type="button" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button class="btn btn--primary btn--lg btn--block" type="submit">Try again</button>
      </form>
    </div>
  </div>
</main>
<p class="mock-note" style="bottom: 5rem; right: 1rem;">Network failure, not a credential failure: the copy says so and the button becomes Try again.</p>
